# ============================================================
# Project-wide Gradle settings
# ============================================================

# ── AndroidX Migration ──────────────────────────────────────
# Bắt buộc bật để dùng thư viện AndroidX (androidx.core:core-ktx,
# arsceneview:2.2.1, v.v.). Thiếu cờ này gây lỗi classpath conflict.
android.useAndroidX=true

# ── JVM Build Memory ────────────────────────────────────────
# Cấp 2GB heap cho Gradle daemon; Filament/Sceneview sinh ra nhiều
# class nên cần bộ nhớ lớn hơn mặc định (512 MB).
# -Dfile.encoding=UTF-8 tránh lỗi encoding trên Windows.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ── R class optimization ────────────────────────────────────
# Mỗi module chỉ chứa tài nguyên của chính nó → giảm thời gian
# compile và kích thước DEX.
android.nonTransitiveRClass=true

# ── Build Performance ───────────────────────────────────────
# Bật Gradle build cache để tái dụng kết quả compile giữa các lần.
org.gradle.caching=true

# Chạy song song các task độc lập (giảm thời gian build).
org.gradle.parallel=true

# Kotlin code style (official | obsolete)
kotlin.code.style=official
